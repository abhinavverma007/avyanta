<div class="login-root">

  <!-- Left panel: brand hero -->
  <div class="hero-panel">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="brand-logo">
        <span class="brand-sun">SUN</span><span class="brand-desh">देश</span>
      </div>
      <p class="hero-greeting">{{ greeting }}.</p>
      <p class="hero-tagline">Empowering India<br>with Solar Energy.</p>
      <p class="hero-sub">One login for your whole team — laborers, supervisors, managers and the owner.</p>
    </div>
    <div class="solar-panels-bg"></div>
  </div>

  <!-- Right panel: login form -->
  <div class="form-panel">
    <div class="form-inner fade-in">

      <!-- Mobile-only brand mark — the hero panel (which normally carries
           this) is hidden below 900px, so the card would otherwise float
           on the background with no branding at all. -->
      <div class="mobile-brand">
        <span class="brand-sun">SUN</span><span class="brand-desh">देश</span>
      </div>

      <!-- Form header -->
      <div class="form-header">
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Sign in to SUN<strong>दे</strong>श</p>
      </div>

      <!-- Login form -->
      <form class="login-form" (ngSubmit)="onSubmit()" novalidate>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="email"
              class="form-control"
              placeholder="you@sundesh.in"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap password-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              class="form-control"
              placeholder="••••••••••"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-pw" (click)="showPassword.set(!showPassword())" aria-label="Toggle password visibility">
              @if (showPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="error-msg" role="alert">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-blue btn-full btn-lg login-btn" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner"></span> Signing in…
          } @else {
            Sign In
          }
        </button>

        <p class="footer-note">Trouble signing in? Ask the owner to reset your password.</p>
      </form>

    </div>
  </div>
</div>
