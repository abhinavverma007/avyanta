<div class="page fade-in">
  <div class="page-header">
    <h1 class="page-title">Approvals</h1>
    <p class="page-sub">Review and approve expense claims, leave requests and attendance regularizations</p>
  </div>

  <div class="section-switcher">
    <button class="section-tab" [class.active]="section() === 'reimbursements'" (click)="setSection('reimbursements')">
      Reimbursements
    </button>
    <button class="section-tab" [class.active]="section() === 'leave'" (click)="setSection('leave')">
      Leave
    </button>
    <button class="section-tab" [class.active]="section() === 'regularization'" (click)="setSection('regularization')">
      Regularization
    </button>
  </div>

  @if (section() === 'reimbursements') {
    <app-superadmin-reimbursements />
  } @else if (section() === 'leave') {
    <app-superadmin-leave-approvals />
  } @else {
    <app-superadmin-regularization-approvals />
  }
</div>
