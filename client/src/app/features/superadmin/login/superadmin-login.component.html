<div class="sa-login-root">
  <div class="sa-login-card card card-padded fade-in">
    <div class="sa-brand">
      <span class="brand-sun">SUN</span><span class="brand-desh">देश</span>
    </div>
    <p class="sa-sub">Superadmin Console</p>

    <form class="sa-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          placeholder="owner@sundesh.in"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            placeholder="••••••••••"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pw" (click)="showPassword.set(!showPassword())" aria-label="Toggle password visibility">
            @if (showPassword()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <p class="error-msg" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-blue btn-full btn-lg" [disabled]="loading()">
        @if (loading()) { <span class="spinner"></span> Signing in… } @else { Sign In }
      </button>
    </form>
  </div>
</div>
