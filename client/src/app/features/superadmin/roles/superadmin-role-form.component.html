<div class="page fade-in">
  <button type="button" class="btn btn-ghost btn-sm back-btn" (click)="goBack()">{{ 'saRoleForm.back' | t }}</button>

  <div class="page-header">
    <h1 class="page-title">{{ 'saRoleForm.title' | t }}</h1>
    <p class="page-sub">{{ 'saRoleForm.sub' | t }}</p>
  </div>

  <div class="card card-padded form-panel fade-in">
    <div class="form-group">
      <label class="form-label">{{ 'saRoleForm.name' | t }}</label>
      <input
        class="form-control"
        [placeholder]="'saRoleForm.namePh' | t"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </div>
    <p class="form-hint">{{ 'saRoleForm.hint' | t }}</p>
    @if (error()) { <p class="error-msg">{{ msg(error()) }}</p> }
    <div class="form-actions">
      <button class="btn btn-ghost" (click)="goBack()">{{ 'saRoleForm.cancel' | t }}</button>
      <button class="btn btn-blue" [disabled]="creating()" (click)="createRole()">
        {{ (creating() ? 'saRoleForm.creating' : 'saRoleForm.create') | t }}
      </button>
    </div>
  </div>
</div>
